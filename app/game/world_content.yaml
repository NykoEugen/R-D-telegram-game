# Random NPC dialogue variants and world travel texts

npc_variants:
  bruno:  # Бруно Трактирник — грубий але чесний
    greetings:
      - uk: "Бруно кидає погляд від стійки і знову опускає голову. «Сідай, де є місце. Кухоль самі не приходять»."
        en: "Bruno glances from the counter and lowers his head again. 'Sit where there's room. Mugs don't pour themselves.'"
      - uk: "«А, ти». Бруно витирає руки об фартух і чекає, що ти замовиш. Ні радості, ні неприязні — просто облік."
        en: "'Oh, you.' Bruno wipes his hands on his apron and waits for your order. No pleasure, no hostility — just accounting."
      - uk: "Бруно тягне кухоль з-під стійки і ставить з глухим стуком. «Важкий день?» Не питання — констатація."
        en: "Bruno pulls a mug from under the counter and sets it down with a dull thud. 'Hard day?' Not a question — a statement."
      - uk: "«Добрий вечір сказав би, якби він таким був». Бруно жестикулює на вільний табурет. «Сідай, не блокуй прохід»."
        en: "'Good evening I'd say if it were one.' Bruno gestures at an empty stool. 'Sit down, stop blocking the passage.'"
      - uk: "Бруно не піднімає очей від бочки, яку відкриває. «Зачекай хвилину. Або дві. Або стій — мені однаково»."
        en: "Bruno doesn't look up from the barrel he's opening. 'Wait a minute. Or two. Or stand there — makes no difference to me.'"
    rumors:
      - uk: "«На Гончарній вулиці знову горить ліхтар уночі, хоча ніхто його не запалює. Міська рада каже — несправна кріплення. Міська рада багато чого каже»."
        en: "'A lantern on Potter Street keeps burning at night even though no one lights it. Town council says it's a faulty fitting. Town council says a lot of things.'"
      - uk: "«Міллер з млина на Балочній продав усю муку за три дні — це майже рік запасів. Куди вона пішла, до кого і навіщо — ніхто не каже». Бруно протирає стійку. «Нікому»."
        en: "'The miller on Balochna sold a year's worth of flour in three days. Where it went, to whom and why — nobody says.' Bruno wipes the counter. 'Nobody.'"
      - uk: "«Казали, гінець з півдня приїхав і одразу пішов до Ядвіги. Пробув там з годину. Виходив — руки тремтіли». Пауза. «Мені потім розповіли. Я не дивився»."
        en: "'Word is a courier came from the south and went straight to Yadviha. Spent an hour in there. When he left — hands were shaking.' A pause. 'Someone told me later. I wasn't watching.'"
      - uk: "«У болотах за лісом собаки знову скімлять. Мисливці знають, що це значить. Мисливці в місті залишились»."
        en: "'Dogs are whining again out past the forest, near the marshes. The hunters know what that means. The hunters have stayed in town.'"
      - uk: "«На нічному ринку минулої неділі щось продавали закрите в мішку. Хто купив — не знаю. Що там було — не хочу знати. Але гроші були великі»."
        en: "'At the night market last Sunday someone sold something in a closed sack. Who bought it — I don't know. What was in it — I don't want to know. But it was serious money.'"
    farewell:
      - uk: "«Повертайся, якщо є що повернути». Бруно береться за наступний кухоль."
        en: "'Come back if there's something to come back with.' Bruno reaches for the next mug."
      - uk: "«Обережно на вулиці. Каміння нерівне, люди — теж»."
        en: "'Watch yourself out there. The cobblestones are uneven. So are the people.'"
      - uk: "Бруно кидає вслід коротко: «Живим повертайся. Мертві не платять»."
        en: "Bruno calls after you shortly: 'Come back alive. Dead men don't pay.'"

  marta:  # Гільд-майстер Марта — сувора, конкретна, мало слів
    greetings:
      - uk: "Марта піднімає погляд від книги. Секунда оцінки. «Що потрібно»."
        en: "Marta raises her eyes from the book. One second of assessment. 'What do you need.'"
      - uk: "«Ти вчасно». Марта каже це без теплоти, але і без претензій — просто факт."
        en: "'You're on time.' Marta says it without warmth but without reproach — just a fact."
      - uk: "Марта ставить перо, складає руки. «Слухаю»."
        en: "Marta sets down her quill, folds her hands. 'I'm listening.'"
      - uk: "«Сідай». Жест на стілець. Більше нічого поки що."
        en: "'Sit.' A gesture at the chair. Nothing more for now."
    quest_hints:
      - uk: "«На дошці з'явились нові завдання. Переглянь, поки вільний»."
        en: "'New jobs appeared on the board. Look them over while you're free.'"
      - uk: "«Є кілька доручень, що чекають виконавця. Вони не стануть легшими від очікування»."
        en: "'Several commissions are waiting for a taker. They won't get easier with waiting.'"
      - uk: "«Два замовники прийшли цього ранку. Обидва хочуть результату скоро. Можеш взяти одне»."
        en: "'Two clients came this morning. Both want results soon. You can take one.'"
      - uk: "Марта кладе на стіл аркуш. «Читай. Вирішуй. Якщо береш — підпис тут»."
        en: "Marta places a sheet on the table. 'Read it. Decide. If you're taking it — signature here.'"

  haim:  # Купець Хаїм — торгаш з душею, знає все про місто
    greetings:
      - uk: "Хаїм розправляє тканину на прилавку і жестом запрошує підійти. «Дивись, питай, не сором'яся. Я не кусаюсь — я лише рахую»."
        en: "Haim smooths the fabric on the counter and gestures you closer. 'Look, ask, don't be shy. I don't bite — I only count.'"
      - uk: "«О! Знайоме обличчя». Хаїм говорить це навіть тоді, коли ти тут вперше. Ефект є."
        en: "'Oh! A familiar face.' Haim says this even when you've never met. It still works."
      - uk: "«Хороший день для торгівлі». Хаїм обводить рукою площу. «Хоча поганий теж непоганий, якщо знати, що продавати»."
        en: "'Good day for trade.' Haim sweeps his arm across the square. 'Though a bad day is also not bad if you know what to sell.'"
      - uk: "Хаїм відкладає рахівницю. «Тебе мені сьогодні і треба було. Є розмова і є товар — вибирай з чого почати»."
        en: "Haim sets down his abacus. 'You're exactly who I needed today. There's conversation and there's goods — you pick where we start.'"
    city_news:
      - uk: "«Слухай, мені тут капітан варти Ядвіга замовила сталевий дріт — три бухти. Для чого трактирнику сталевий дріт? Не трактирнику — варті. Питання відкрите»."
        en: "'Listen, the guard captain Yadviha ordered three coils of steel wire from me. What does the guard need with steel wire? That's the open question.'"
      - uk: "«Нові люди в місті. Не авантюристи — інші. Приїхали тихо, зупинились у Бруно, нікуди не ходять». Хаїм знижує голос. «Але за всіма дивляться уважно»."
        en: "'New people in town. Not adventurers — different. Arrived quietly, staying with Bruno, going nowhere.' Haim lowers his voice. 'But watching everyone very carefully.'"
      - uk: "«Аптекар Мирон скупив останній запас болотяного зілля на ринку — у трьох торгівців відразу. Каже, на запас. Коли Мирон робить запас — це або бізнес, або він щось знає»."
        en: "'Apothecary Myron bought out the last marsh herb from three traders at once. Says it's for stock. When Myron stocks up — it's either business or he knows something.'"
      - uk: "«У Вовчому Яру знайшли перекинутий віз — без коня, без товару, без власника. Вже третій за два місяці». Хаїм підіймає палець. «Я туди більше не їжджу»."
        en: "'They found an overturned wagon in Vovchyi Yar — no horse, no goods, no owner. Third one in two months.' Haim raises a finger. 'I don't go that way anymore.'"

street_events:
  - uk: "Двоє чоловіків біля криниці мовчки дивляться вниз у воду. Ти проходиш, озираєшся — все ще дивляться. Що там — невідомо. Запитувати якось не хочеться."
    en: "Two men stand by the well staring down into the water. You pass, look back — still staring. What's down there is unclear. Somehow you don't want to ask."
  - uk: "Коваль вибігає з майстерні, кричить щось у бік ринку і повертається назад. Через хвилину — знову. Третього разу вже не виходить. Мабуть, вирішив."
    en: "The blacksmith runs out of his workshop, shouts something toward the market, goes back inside. A minute later — again. The third time he doesn't come out. Apparently settled."
  - uk: "Хлопчик продає на кутку «щасливі камінці» — по мідяку штука. Камінці звичайні, річкові. Але черга є."
    en: "A boy on the corner is selling 'lucky stones' — a copper each. Regular river stones. But there's a queue."
  - uk: "Піп іде по вулиці, бурмочучи молитву і тримаючись ближче до центру бруківки, подалі від усіх парканів. Ти помічаєш: він робить так завжди."
    en: "The priest walks down the street muttering a prayer, keeping to the centre of the cobblestones and away from all the fences. You notice he always does this."
  - uk: "З вікна на другому поверсі хтось викидає зв'язку цибулі — і вона влучно приземляється на голову перехожому, який зупиняється, задирає голову, і мовчки йде далі. Місто навчило не реагувати."
    en: "Someone throws a bundle of onions from a second-floor window — and it lands squarely on a passing man's head. He stops, looks up, walks on without a word. The town has taught people not to react."
  - uk: "На паркані написано крейдою: «Боргуєш Стасу — плати». Нижче, іншою рукою: «Хто такий Стас?». Ще нижче: «Я Стас і це не смішно»."
    en: "Someone has chalked on a fence: 'If you owe Stas — pay.' Below, in different handwriting: 'Who's Stas?' Below that: 'I'm Stas and this isn't funny.'"
  - uk: "Жінка несе вів'язку хмизу, яка вдвічі більша за неї. Ти пропонуєш допомогти. «Сама». Тон не злий — просто тут так."
    en: "A woman carries a bundle of brushwood twice her size. You offer to help. 'I've got it.' The tone isn't unkind — it's just how it is here."
  - uk: "Два кицьки на даху сваряться з такою серйозністю, що кілька перехожих зупиняються подивитись. Нічого більше не відбувається, але всі стоять і чекають вирішення конфлікту."
    en: "Two cats on a rooftop argue with such seriousness that several passers-by stop to watch. Nothing else happens, but everyone stands waiting for the conflict to resolve."
  - uk: "З-за рогу тягне горілим і ще чимось — незрозумілим, але неприємним. Перехожі прискорюють крок і не дивляться в той бік. Ти теж прискорюєш."
    en: "Around the corner comes the smell of something burnt and something else — unclear but unpleasant. Passers-by quicken their pace without looking that way. You quicken yours too."
  - uk: "Стара сидить на порозі і дивиться на тебе так, ніби впізнає. Ти точно тут вперше. Вона повертається до в'язання. Де-не-де є відчуття, що місто тебе вже чекало."
    en: "An old woman sits on her doorstep looking at you as though she recognises you. You have definitely never been here before. She goes back to her knitting. Occasionally there is a sense that the town was already expecting you."

travel_texts:
  tavern_to_market:
    uk: "За таверною дорога розширюється і відразу стає гамірніше — чути ринок ще за квартал, голоси і запах смаженого накочують хвилею. Бруківка тут витертіша і жирніша — роки обозів і ніг."
    en: "Past the tavern the road widens and the noise picks up immediately — you can hear the market a block away, voices and the smell of frying rolling in like a wave. The cobblestones here are more worn and greasier — years of carts and feet."
  market_to_street:
    uk: "Ринковий гамір відступає поступово, замінюється звичайним міським: чийсь молоток, дитячий крик, собака десь за парканом. Вулиці звужуються, тіні між будинками ущільнюються."
    en: "The market noise fades gradually, replaced by ordinary town sounds: someone's hammer, a child's shout, a dog somewhere behind a fence. The streets narrow, the shadows between buildings thicken."
  street_to_guild:
    uk: "Гільдійна будівля видна здалеку — камінна, без вивіски, і саме ця відсутність вивіски говорить більше за будь-який напис. Двері закриті, але не замкнені — це різниця, яку тут розуміють."
    en: "The guild building is visible from a distance — stone, without a sign, and that absence of a sign says more than any inscription would. The door is closed but not locked — a distinction people here understand."
  street_to_city_gate:
    uk: "Міські ворота вже видно в кінці вулиці — масивні, дубові, з двома вартовими, яким явно нікуди поспішати. Дорога до воріт йде повз останні будинки, і чимось у повітрі — вугільний дим і гниле листя — вже відчувається відкритий простір за ними."
    en: "The city gates are already visible at the end of the street — massive, oak, with two guards who have nowhere to be in a hurry. The road to the gates runs past the last buildings, and something in the air — coal smoke and rotting leaves — already hints at the open space beyond."
  city_gate_to_road:
    uk: "За воротами місто обривається різко, як обірвана нитка — і відразу починається дорога, широка, пильна, зі слідами коліс і копит. Кам'янобрід залишається позаду разом із своїм гамором і запахами."
    en: "Beyond the gates the town cuts off sharply, like a broken thread — and immediately begins the road, wide, dusty, marked with wheel ruts and hoofprints. Kamenobrid stays behind with all its noise and smells."
  road_to_forest:
    uk: "Ліс починається поступово — спочатку поодинокі дерева вздовж узбіччя, потім все щільніше, поки дорога не перетворюється на тунель із гілок. Світло міняється, звуки теж — птахи інші, і тиша між ними густіша."
    en: "The forest begins gradually — first scattered trees along the verge, then denser and denser until the road becomes a tunnel of branches. The light changes, so do the sounds — different birds, and the silence between them thicker."
  road_to_farm:
    uk: "Огорожі починаються раніше, ніж сама ферма — спочатку кілки, потім жердини, потім хтось добре зробив паркан. Пахне землею і гноєм, і чомусь це заспокоює."
    en: "The fences start before the farm itself — first stakes, then rails, then someone who did a proper job. It smells of earth and manure, and somehow that is calming."
  forest_to_ruins:
    uk: "Між стовбурами починають проглядати камені — спочатку здається, що просто великі валуни, але ні: кути надто рівні, і мох росте там, де ніяке дерево не впало. Руїни вростають у ліс і ліс у них."
    en: "Between the trunks, stones begin to show — at first they look like large boulders, but no: the corners are too regular, and moss grows where no tree has fallen. The ruins are growing into the forest and the forest into them."
  road_to_swamp:
    uk: "Дорога починає розмокати непомітно — спочатку просто м'якше під ногою, потім перший слід води між травою, потім ноги вже видають хлюпіт при кожному кроці. Повітря важчає і пахне тухлим."
    en: "The road begins to soften imperceptibly — at first just softer underfoot, then the first trace of water between the grass, then your feet are already squelching with each step. The air grows heavier and smells of rot."
  swamp_to_beast_lair:
    uk: "Болото стає щільнішим — менше відкритої води, більше кривих дерев зі здертою корою. Сліди на мулі великі й свіжі, і кущі по боках стоять так нерухомо, що мимоволі сповільнюєш хід."
    en: "The swamp thickens — less open water, more twisted trees with stripped bark. The tracks in the mud are large and fresh, and the bushes on either side are so still that you slow down without meaning to."
  market_to_apothecary:
    uk: "Від ринку — за кут, потім ще раз за кут, і вузька вуличка виводить до крамниці Мирона: вивіска скромна, але запах зілля і сухих трав чути ще з повороту. Двері відчинені — він завжди відчинений."
    en: "From the market — around a corner, then around another, and a narrow lane leads to Myron's shop: the sign is modest but the smell of herbs and dried plants reaches you from the turn. The door is open — it always is."
  street_to_night_market:
    uk: "Вдень тут нічого нема — тільки порожня площа і сміття по кутках. Але ввечері між будинками з'являються вогники, і з'являються люди, які вдень тут не бувають, і продають те, що вдень не продається."
    en: "In the daytime there is nothing here — just an empty square and litter in the corners. But in the evening, lights appear between the buildings, and people appear who are never here during the day, selling things that cannot be sold during the day."

location_descriptions:
  city_gate:
    uk: "Ворота відкриті, вартові на місці — ніякого формального огляду, але на тебе дивляться і запам'ятовують. Тут починається і закінчується місто."
    en: "The gates are open, guards in place — no formal inspection, but they look at you and remember. Here is where the town starts and ends."
  road:
    uk: "Головна дорога між Кам'яноброддям і рештою світу: утоптана, розбита ґрунтова колія, що веде через поля і в ліс. Безлюдна — або здається такою."
    en: "The main road between Kamenobrid and the rest of the world: worn, rutted dirt track leading through fields and into forest. Deserted — or so it seems."
  forest:
    uk: "Старий ліс без назви на картах — місцеві просто кажуть «ліс». Темний навіть удень, і звуки в ньому не завжди зрозумілі."
    en: "Old forest with no name on the maps — locals just say 'the forest.' Dark even in daylight, and the sounds in it are not always explainable."
  farm:
    uk: "Хутір Гречків: кілька хат, поле, колодязь і пес, якого тут тримають для того, щоб він гавкав. Він гавкає."
    en: "The Hrechko farmstead: a few cottages, a field, a well, and a dog kept specifically to bark. He is barking."
  ruins:
    uk: "Старі мури — ще замку, ще до замку, незрозуміло чиє. Каміння тут темніше за природне, і зростається з лісом так, ніби ліс і є справжній господар."
    en: "Old walls — of a castle, or before the castle, unclear whose. The stone here is darker than it should be, and it merges with the forest as though the forest is the true owner."
  swamp:
    uk: "Болото без дна і без назви — на карті позначено як «непрохідне», і це чесне позначення. Стежки є, але вони чиїсь, не твої."
    en: "A bottomless, nameless swamp — marked on the map as 'impassable,' which is an honest label. There are paths, but they belong to someone else, not you."
  beast_lair:
    uk: "Між болотом і лісом — западина, де запах падалі і вивернуті дерева говорять самі за себе. Тут щось живе. Або жило зовсім нещодавно."
    en: "Between the swamp and the forest — a hollow where the smell of carrion and uprooted trees speak for themselves. Something lives here. Or lived here very recently."
  apothecary:
    uk: "Крамниця Мирона: темнувато, сухі пучки на стелі, банки і пляшки скрізь. Запах специфічний — не поганий, але такий, що відразу хочеться дихати обережно."
    en: "Myron's shop: slightly dim, dried bundles on the ceiling, jars and bottles everywhere. The smell is specific — not bad, but the kind that makes you want to breathe carefully."
  night_market:
    uk: "Вночі площа перетворюється: вогні, шепіт, товар без питань і без чеків. Тут не запитують ім'я і не запам'ятовують обличчя — принаймні так прийнято вважати."
    en: "At night the square transforms: lights, whispers, goods sold without questions and without receipts. Names are not asked here and faces not remembered — at least that is what people like to believe."
