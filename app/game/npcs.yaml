
# NPC content. One entry per NPC. `dialogues` maps category -> list of
# {uk, en} lines (a random one is picked, cycling before repeating).
# `stage_dialogues` optionally overrides/adds categories for a level bracket
# (e.g. an NPC that reacts differently once the player is stronger).
# Vendors/flavor NPCs can omit a category entirely — app/game/npc_barks.yaml
# supplies a shared fallback pool keyed by `role`.

npcs:
  - id: bruno
    name: {uk: "Бруно Трактирник", en: "Bruno the Innkeeper"}
    location: tavern
    role: questgiver
    quest_links: ["rats_in_cellar"]
    dialogues:
      greeting:
        - uk: "Бруно кидає погляд, ледь киває — і повертається до кухля, який протирає."
          en: "Bruno glances up, gives the smallest nod, and goes back to the mug he's wiping."
        - uk: "«Знову ти», — каже без докору, просто як факт."
          en: "\"You again,\" he says, not as a complaint — just a fact."
      rumor:
        - uk: "«У підвалі завелось щось, що гризе бочки швидше за мене — щури, кажуть. Великі щури»."
          en: "\"Something in the cellar's been chewing through barrels faster than I drink them — rats, they say. Big ones.\""
        - uk: "«Дорога на Дубову переправу знову когось недорахувалась. Друга пропажа за місяць»."
          en: "\"The road to Oak Crossing came up short a traveller again. Second one this month.\""
        - uk: "«Гільдія платить за паперову роботу краще, ніж я плачу за нормальну. Іди туди, як набридне тут»."
          en: "\"The guild pays better for paperwork than I pay for real work. Go there once you're tired of this.\""
      farewell:
        - uk: "«Двері он там. Штовхай, не тягни — місяць як зламані»."
          en: "\"Door's that way. Push, don't pull — been broken a month.\""
    stage_dialogues:
      - min_level: 5
        dialogues:
          greeting:
            - uk: "Бруно дивиться на тебе трохи довше звичного. «Ти вже не той, хто заходив сюди перший раз»."
              en: "Bruno looks at you a beat longer than usual. \"You're not the same one who walked in here first.\""

  - id: marta
    name: {uk: "Гільд-майстер Марта", en: "Guildmaster Marta"}
    location: guild
    role: questgiver
    quest_links: []
    dialogues:
      greeting:
        - uk: "Марта піднімає очі від книги реєстрацій, оцінює тебе одним поглядом і повертається до писанини."
          en: "Marta looks up from the registration book, sizes you up in a glance, and returns to her writing."
      rumor:
        - uk: "«Другий ярус завдань відкривається після кількох виконаних з першого. Не раніше»."
          en: "\"The second tier of jobs opens after you've cleared a few from the first. Not before.\""
        - uk: "«Той, хто йде за Вербову балку вночі без діла — або дурень, або втікач. Обирай, ким бути»."
          en: "\"Anyone who goes past Verbova Ravine at night without a reason is either a fool or running from something. Pick one.\""
      farewell:
        - uk: "«Дошка — там же, де й учора»."
          en: "\"The board's where it was yesterday.\""

  - id: haim
    name: {uk: "Купець Хаїм", en: "Merchant Haim"}
    location: market
    role: vendor
    quest_links: []
    dialogues:
      greeting:
        - uk: "Хаїм відривається від рахунків рівно на стільки, щоб оцінити товщину твого гаманця."
          en: "Haim looks up from his accounts just long enough to gauge the weight of your purse."
      rumor:
        - uk: "«Тримайся подалі від Вербової балки вночі. Там нічого доброго — і нічого мого»."
          en: "\"Stay away from Verbova Ravine at night. Nothing good there — and nothing of mine.\""

  - id: old_pyotr
    name: {uk: "Старий Петро", en: "Old Pyotr"}
    location: road
    role: vendor
    quest_links: []
    dialogues: {}
