scenes:
  tavern_intro:
    uk: "Двері «Срібного Кабана» відчиняються з гучним скрипом, і в обличчя вдаряє хвиля тютюнового диму, смаженого сала та чогось невизначено кислого. За дерев'яними столами горлають п'яниці, десь у кутку б'ються об заклад двоє мулярів, а хазяїн — велетень з руками як колоди — витирає кухоль ганчіркою сумнівної чистоти. Місце вдає з себе притулок для стомлених мандрівників. Насправді ж — це де Доля зводить людей, яким краще б не зустрічатись."
    en: "The door of the Silver Boar swings open with a groan that could wake the dead, and the air hits you like a fist — tobacco, grease, and something sourly unidentifiable. Drunken voices argue over nothing, two masons haggle loudly in the corner, and the innkeeper — a man built like an ox — polishes a mug with a rag that has seen better decades. The place calls itself a refuge for weary travelers. In truth, it is where Fate drags people who would rather not have met."

  rumors_board:
    uk: "Дошка оголошень висить між двома оленячими рогами і вкрита шаром паперів різного ступеня свіжості. Хтось шукає загублену козу. Хтось пропонує нагороду за голову розбійника — і судячи з пожовклого паперу, розбійник або мертвий, або дуже вже спритний. Поміж побутовими клопотами — щось цікавіше: записка без підпису, чорнило свіже."
    en: "The notice board hangs between two antler mounts and is layered with papers of varying age and urgency. Someone wants a lost goat returned. Someone offers a bounty on a bandit's head — judging by the yellowed paper, the bandit is either long dead or remarkably elusive. Among the mundane troubles there is something more intriguing: an unsigned note, the ink still fresh."

  forest_encounter:
    uk: "Ліс тут живе своїм темним життям — гілки переплітаються над головою, перекриваючи небо, і навіть удень тут присмерки. Щось клацнуло з-за дерева. Потім ще раз — ближче. Ти вже стоїш нерухомо, і розумієш: якщо це справді загроза, вона давно тебе бачить."
    en: "The forest lives a dark life of its own — branches weave overhead, shutting out the sky, and even at midday the light here is the grey of early dusk. Something snapped beyond a tree. Then again, closer. You stand very still, and understand: if this is truly a threat, it has been watching you for some time."

  mysterious_stranger:
    uk: "Він сидів у найтемнішому кутку таверни так давно, що здавалося — виріс тут разом з меблями. Глибокий капюшон ховає обличчя, але пальці на кухлі — тонкі, спокійні, без зайвих рухів. Коли він нарешті звертається до тебе, голос тихий і точний, як ніж: «Мені потрібна людина, якій не страшно побачити те, чого не існує»."
    en: "He had been sitting in the darkest corner of the tavern so long he seemed to have grown there along with the furniture. A deep hood conceals his face, but the fingers wrapped around his cup are thin, still, and deliberate. When he finally speaks to you, his voice is quiet and precise as a blade: 'I need someone who is not afraid to look at something that does not exist.'"

  city_patrol:
    uk: "Двоє вартових перегороджують вузький провулок, і вигляд у них — людей, яким холодно, нудно і дуже хочеться знайти приводу зробити чиїсь проблеми своєю розвагою. Руки на списах, очі — на тобі. Можна спробувати пройти спокійно, пояснити хто ти і чого тобі треба. Або — обійти і не спокушати долю."
    en: "Two guards block the narrow alley with the bearing of men who are cold, bored, and very much hoping someone will give them a reason to make trouble into entertainment. Hands rest on spears, eyes rest on you. You can try to pass quietly and explain yourself, or find a way around and spare everyone the bother."

  campfire_rest:
    uk: "Вогнище тріщить тихо й рівно, розганяючи темряву на кілька кроків. За цим колом — ніч, ліс, і все те, чому краще не знати твоє ім'я. Але тут — тепло, шматок хліба, і хвилина, коли можна опустити плечі й просто дихати. Такі хвилини треба цінувати. Вони рідкісні."
    en: "The campfire crackles softly and steadily, pushing back the darkness for a few careful paces. Beyond that circle — night, forest, and everything that is better off not knowing your name. But here there is warmth, a crust of bread, and a moment where you can let your shoulders drop and simply breathe. Treasure these moments. They are rare."

  ancient_ruins:
    uk: "Камені тут пам'ятають те, про що люди вже забули. Написи на стінах — не якоюсь відомою мовою, але від них чомусь стає незатишно, ніби слова дивляться на тебе у відповідь. Підлога вкрита пилом, але сліди в пилу свіжіші, ніж хотілось би. Хтось тут недавно ходив."
    en: "These stones remember things people have long since forgotten. The inscriptions on the walls are in no language you know, yet they make you uneasy in a particular way — as though the words are looking back at you. The floor is thick with dust, but the tracks in that dust are fresher than you would prefer. Someone has been here recently."

  stranger_quest:
    uk: "Незнайомець розгортає перед тобою схему — намальовану впевненою рукою, з деталями, яких не здобудеш просто так. Він говорить спокійно, без зайвих слів, і саме ця спокійність трохи непокоїть: люди, які звикли до небезпечних справ, саме так і виглядають. Завдання не просте, але умови — більш ніж достатні. Питання в тому, чи сказав він усе."
    en: "The stranger unfolds a diagram before you — drawn by a confident hand, with details that do not come cheap. He speaks evenly, without excess words, and it is precisely this calm that unsettles you slightly: people accustomed to dangerous business tend to look exactly like this. The task is not simple, but the terms are more than fair. The question is whether he has told you everything."

  stranger_warning:
    uk: "Він зупиняється посеред речення і дивиться на тебе довше, ніж потрібно для звичайного погляду. «Те місце... там були й інші до тебе. Не всі повернулись. Не через те, що були слабші — просто не знали, чого чекати». Пауза. «Тепер знаєш ти»."
    en: "He stops mid-sentence and holds your gaze a moment longer than casual conversation requires. 'That place... others went there before you. Not all came back — not because they were weaker, simply because they did not know what to expect.' A pause. 'Now you do.'"

  tavern_return:
    uk: "«Срібний Кабан» не змінився ні на крихту — ті самі голоси, той самий дим, той самий хазяїн з тією самою ганчіркою. Але ти — вже трохи інший. Або набагато. Залежить від того, що трапилось там, звідки ти повернувся. Кухоль пива стає на стіл із гучним стуком. Хазяїн навіть не питає."
    en: "The Silver Boar has not changed by a hair — the same voices, the same smoke, the same innkeeper with the same rag. But you are somewhat different. Or considerably so, depending on what happened wherever you came back from. A mug of ale lands on the table with a heavy thud. The innkeeper doesn't even ask."

  market_square:
    uk: "Ринкова площа гуде, як вулик, якому наступили на дно. Крамарі кричать наперебій, хтось сперечається з м'ясником за ціну, діти женуть між ногами у дорослих і зникають непомітно разом із чужими гаманцями. Запахи змішуються в один великий хаос: спеції, риба, кінський гній і де-не-де — щось приємне. Тут можна знайти майже все. І майже всього можна позбутись."
    en: "The market square hums like a hive that has been kicked. Vendors shout over each other, someone argues with a butcher over price, children weave between adult legs and vanish quietly with other people's purses. The smells collapse into a single magnificent chaos: spices, fish, horse dung, and here and there something genuinely pleasant. You can find almost anything here. You can also lose almost everything."

  forest_deeper:
    uk: "Чим далі в ліс, тим тихіше — і ця тиша неправильна. Птахи не співають. Вітер не шарудить листям. Навіть власні кроки здаються занадто голосними, ніби ліс слухає і не хоче, щоб ти цього знав. Відчуття погляду в спину з'являється поступово, як холод від річки."
    en: "The deeper into the forest, the quieter — and the quiet is wrong. No birds. No wind in the leaves. Even your own footsteps seem too loud, as though the forest is listening and does not want you to know. The feeling of being watched settles on your back gradually, the way cold comes off a river."

  ruins_treasure:
    uk: "За обваленою стіною виявляється простір, якого немає на жодній схемі. Посеред нього — скриня, окута бронзою, з замком, що встиг покрити себе зеленню. Замок відчиняється легше, ніж мав би. Всередині — монети, чаша зі срібла і щось загорнуте в промаслений шкіряний клапоть. Хтось ховав це ретельно. Але не прийшов забрати."
    en: "Behind a collapsed wall is a space that appears on no diagram. At its centre — a bronze-banded chest with a lock gone green with age. The lock opens easier than it should. Inside: coins, a silver cup, and something wrapped in an oiled leather pouch. Someone hid this carefully. But never came back for it."

  ruins_trap:
    uk: "Ти відчуваєш клацання під підошвою рівно на секунду раніше, ніж все йде не так. Камінь іде вниз, щось свистить збоку, і ти кидаєшся геть — інстинктивно, не думаючи. Коли пил осідає, стає ясно: руїни не просто старі. Руїни чекали."
    en: "You feel the click beneath your sole exactly one second before everything goes wrong. Stone drops, something whistles from the side, and you throw yourself clear — on instinct, no thought involved. When the dust settles it becomes clear: the ruins are not merely old. The ruins were waiting."

  quest_accept:
    uk: "Ти киваєш. Умови прийнято — тепер це вже не чужа справа, а твоя. В кишені — або аванс, або інструкції, або просто нова проблема в обгортці можливості. Так починається більшість пригод, які потім довго згадують. Або не згадують зовсім, якщо не повезе."
    en: "You nod. Terms accepted — what was someone else's problem is now yours. In your pocket: either an advance, or instructions, or simply a new problem dressed as an opportunity. This is how most adventures begin — the kind people talk about for years afterward. Or not at all, if things go poorly."

  quest_decline:
    uk: "Ти хитаєш головою. НПС дивиться на тебе секунду — без осуду, без здивування, лише з тією особливою втомою людини, яка вже знає, що не всі погоджуються. «Що ж», — каже він врешті. «Якщо передумаєш — знаєш де мене знайти»."
    en: "You shake your head. They watch you for a moment — no judgment, no surprise, only the particular weariness of someone who already knew not everyone would agree. 'Well,' they say at last. 'If you change your mind, you know where to find me.'"

  quest_objective:
    uk: "Ось воно — місце, про яке говорили. На вигляд непримітне: або занедбана будівля, або глухий куток лісу, або щось ще, що людина обходить стороною без видимих причин. Але ти тут із причиною. Час розібратись, що насправді відбувається."
    en: "Here it is — the place they described. Unremarkable to look at: a derelict building, a forgotten forest hollow, or something else that people quietly avoid without knowing quite why. But you are here with a reason. Time to find out what is actually going on."

  shop_visit:
    uk: "Крамниця пахне воском, залізом і часом — тим особливим запахом місць, де речі чекають нових господарів. На полицях — всяке: корисне, сумнівне і кілька предметів, про призначення яких краще не питати. Крамар поглядає на тебе з-поза стосу паперів. «Дивись, не лапай», — каже він одразу, ще до привітання."
    en: "The shop smells of wax, iron, and time — that particular smell of places where objects wait for new owners. The shelves hold all sorts: useful things, questionable things, and several items whose purpose it is better not to ask about. The shopkeeper eyes you over a pile of papers. 'Look, don't touch,' he says immediately, before any greeting."

  boss_encounter:
    uk: "Це — не черговий бандит і не варта, яку можна обдурити словами. Те, що стоїть перед тобою, було тут до тебе — і планує бути тут після. В повітрі висить щось важке, щось прадавнє. Ти відчуваєш це у грудях, у кістках. Але кроку назад вже нема."
    en: "This is not another bandit and not a guard you can talk your way past. Whatever stands before you was here before you — and intends to remain long after. Something heavy hangs in the air, something ancient. You feel it in your chest, in your bones. But there is no step back to take."

  victory_celebration:
    uk: "Коли все закінчується і ти стоїш — живий, хоча і не у найкращому вигляді — приходить та дивна мить тиші, перш ніж усвідомлення наздоганяє тіло. Ти переміг. Не красиво, можливо. Не без синців і сумнівів. Але — переміг. Це рахується."
    en: "When it is over and you are standing — alive, if not looking your finest — there comes that strange moment of silence before understanding catches up with the body. You won. Not elegantly, perhaps. Not without bruises and doubts. But you won. That counts."

  defeat_retreat:
    uk: "Мудрість полягає в тому, щоб знати, коли бій програно до кінця. Ти відступаєш — це не ганьба, це вибір, завдяки якому буде завтра. Але подряпини саднять, і десь у грудях — те відчуття незавершеного, що не дасть спокійно спати."
    en: "Wisdom lies in knowing when a fight is lost before it finishes you. You retreat — this is not shame, it is the choice that makes tomorrow possible. But the wounds sting, and somewhere in your chest there is the feeling of unfinished business that will not let you sleep easily."

  quest_complete:
    uk: "Справу зроблено. Той, хто давав завдання, дивиться на тебе з виразом людини, яка не звикла дякувати, але зараз змушена. Нагорода переходить з рук у руки — важча, ніж здавалась на словах, що вже добре. Ти трохи краще знаєш цей світ. Він трохи краще знає тебе."
    en: "The job is done. The one who gave the task looks at you with the expression of someone unaccustomed to gratitude but presently required to offer it. The reward changes hands — heavier than it sounded in words, which is a good sign. You know this world a little better now. It knows you a little better too."

  quest_failed:
    uk: "Буває. Не все вдається з першого разу — або з другого. Замовник дивиться з тим особливим мовчанням, гіршим за будь-які слова. Ти забираєш те, що лишилось від твоїх зусиль, і йдеш. Поразки теж чогось навчають. Хоча й дорогою ціною."
    en: "It happens. Not everything works the first time — or the second. The client watches with that particular silence worse than any words. You take what remains of your efforts and leave. Failures teach you things too. Just at a higher price."

  end_adventure:
    uk: "Ця глава закрита. Попереду — щось нове, невідоме, або просто наступний день у світі, де спокійних днів майже не буває. Але ти вижив, щось зробив, і, можливо, навіть не пошкодував. Пригоди рідко закінчуються так, як починались. Ця — не виняток."
    en: "This chapter is closed. Ahead lies something new, unknown, or simply the next day in a world where quiet days are rare. But you survived, you did something, and perhaps you do not regret it. Adventures rarely end the way they begin. This one is no exception."
